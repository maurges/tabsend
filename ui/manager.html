<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Tabsend </title>

    <style>
      * {
        font-family: Arial, sans-serif;
      }

      .global-column {
        margin: 50px auto 0 auto;
        width: 790px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 50px;
      }

      .global-row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 50px;
        padding: 0 20px;
      }

      .device-column {
        width: 350px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .tab-column {
        width: 350px;
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 0;

        > .device-title {
          width: 226px; /* Aligns with the text of a tab with a favicon */
          font-size: 18px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        > .placeholder {
          text-align: center;
          display: block;
        }
      }
      .tab {
        box-sizing: border-box;
        border-radius: 10px;
        width: 320px;
        height: 35px;

        display: flex;
        flex-direction: row;
        padding: 10px 20px;
        align-items: center;
        gap: 5px;
        background-color: #fff;

        &:hover {
          background-color: #e6e6e6;
        }

        > img {
          flex-shrink: 0;
          width: 18px;
          height: 18px;
        }
        > svg {
          flex-shrink: 0;
          width: 22px;
          height: 22px;

          &:hover {
            background-color: #ccc;
            border-radius: 3px;
          }
        }

        > span {
          flex-grow: 1;
          text-align: left;
          white-space: nowrap;
          overflow: hidden;
          mask-image: linear-gradient(to right, black calc(100% - 10px), transparent 100%);
          font-size: 15px;
          color: #333;
        }
      }
      .tab.tab-grayed {
        background-color: #ddd;
        opacity: 50%;
      }

      #settings-button {
        all: unset;
        width: 50px; align-self: flex-end;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 15px;
        border-radius: 15px; border-color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        background: #fff;

        &:hover {
          background-color: #e6e6e6;
        }
        &:active {
          background-color: #bbb;
        }
      }
    </style>

    <script src="./manager.js" defer=true></script>
    <script src="./alpine.js" defer=true></script>
  </head>
  <body x-data="globalFunctions" class="global-column" style="background-color: #fff">

    <div class="global-row">

      <div class="tab-column"
           x-data="localTabModel"
           x-on:dragover="onDragOver('__LOCAL', $event)"
           x-on:dragleave="onDragLeave('__LOCAL', $event, $el)"
           x-on:drop="onDrop('__LOCAL', $event)"
      >
        <div class="device-title"> Local </div>
        <template x-for="tab in tabs">
          <div draggable=true
               x-bind:class="tab.state === 'grayed' ? 'tab tab-grayed' : 'tab'"
               x-on:dragstart="onDragStart($event, tab, '__LOCAL')"
               x-on:dragend="onDragEnd()"
          >
            <img x-show="tab.favicon !== null" x-bind:src="tab.favicon"></img>
            <span x-text="tab.title"></span>
            <svg viewBox="0 0 22 22" xmlns="https://www.w3.org/2000/svg">
              <line x1="7.5" y1="7.5" x2="14.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
              <line x1="14.5" y1="7.5" x2="7.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
        </template>
        <div class="tab placeholder" x-show="shouldShowHover('__LOCAL')">Send here</div> <!-- placeholder for drag -->
      </div>

      <div class="device-column" x-data="remoteDeviceModel">
        <template x-for="device in devices">
          <div class="tab-column"
               x-on:dragover="onDragOver(device.name, $event)"
               x-on:dragleave="onDragLeave(device.name, $event, $el)"
               x-on:drop="onDrop(device.name, $event)"
          >
            <div class="device-title" x-text="device.name"></div>
            <template x-for="tab in device.tabs">
              <div draggable=true
                   x-bind:class="tab.state === 'grayed' ? 'tab tab-grayed' : 'tab'"
                   x-on:dragstart="onDragStart($event, tab, device.name)"
                   x-on:dragend="onDragEnd()"
              >
                <img x-show="tab.favicon !== null" x-bind:src="tab.favicon"></img>
                <span x-text="tab.title"></span>
                <svg viewBox="0 0 22 22" xmlns="https://www.w3.org/2000/svg">
                  <line x1="7.5" y1="7.5" x2="14.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
                  <line x1="14.5" y1="7.5" x2="7.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
            </template>
            <div class="tab placeholder" x-show="shouldShowHover(device.name)">Send here</div> <!-- placeholder for drag -->
          </div>

        </template>
      </div>

    </div>

    <button x-on:click="openOptions()" id="settings-button">
      <img src="../icons/preferences.svg">
    </button>

  </body>
</html>
