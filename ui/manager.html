<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Tabsend </title>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      :root {
        --pane-width: 350px;
        --pane-gap: 50px;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #fff;
      }

      .global-column {
        margin: 50px auto 0 auto;
        max-width: calc(var(--pane-width) * 2 + var(--pane-gap));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--pane-gap);
      }

      .global-row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        gap: 50px;
        @media (max-width: 750px) { /* calc(var(--pane-width) * 2 + var(--pane-gap)) */
          flex-direction: column;
          align-self: stretch;
          align-items: center;
        }
      }

      .device-column {
        width: var(--pane-width);
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .tab-column {
        --tab-hpadding: 20px;
        --favicon-size: 18px;
        --tab-gap: 5px;

        max-width: var(--pane-width);
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 15px;

        > .device-title {
          align-self: stretch;
          padding-left: calc(var(--tab-hpadding) + var(--favicon-size) + var(--tab-gap)); /* Aligns after the favicon */
          font-size: 18px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        > .placeholder {
          border-radius: 10px;
          width: 100%;
          height: 35px;
          text-align: center;
          display: block;
        }
      }
      .tab {
        border-radius: 10px;
        width: 100%;
        height: 35px;
        cursor: grab;

        display: flex;
        flex-direction: row;
        padding: 10px var(--tab-hpadding);
        align-items: center;
        gap: var(--tab-gap);
        background-color: #fff;

        &:hover {
          background-color: #e6e6e6;
        }

        > img {
          flex-shrink: 0;
          width: var(--favicon-size);
          height: var(--favicon-size);
        }
        > svg {
          flex-shrink: 0;
          width: 22px;
          height: 22px;
          cursor: default;

          &:hover {
            background-color: #ccc;
            border-radius: 3px;
          }
        }

        > span {
          flex-grow: 1;
          text-align: left;
          white-space: nowrap;
          overflow: hidden;
          mask-image: linear-gradient(to right, black calc(100% - 10px), transparent 100%);
          font-size: 15px;
          color: #333;
        }
      }
      .tab.tab-grayed {
        background-color: #ddd;
        opacity: 0.5;
      }

      #settings-button {
        all: unset; /* border: 0; background: none; padding: 0; something else */
        width: 50px;
        align-self: flex-end;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 15px;
        border-radius: 15px; border-color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        background: #fff;

        &:hover {
          background-color: #e6e6e6;
        }
        &:active {
          background-color: #bbb;
        }
      }

      #send-dropdown {
        position: fixed;
        background: #fff;
        /* border: 1px solid #999; */
        border-radius: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        overflow: hidden;

        > .send-dropdown-element {
          padding: 8px 12px;
          font-size: 16px;
          cursor: default;
          border-bottom: 1px solid #eee;
          &:hover {
            background-color: #e6e6e6;
          }
        }
        > .send-dropdown-separator {
          padding: 8px 12px;
          font-size: 13px;
          cursor: default;
          color: #444;
          border-bottom: 1px solid #eee;
        }
      }
    </style>

    <script src="./manager.js" defer=true></script>
    <script src="./alpine.js" defer=true></script>
  </head>
  <body x-data="app" class="global-column">

    <div class="global-row">

      <div class="tab-column"
           x-on:dragover="onDragOver('__LOCAL', $event)"
           x-on:dragleave="onDragLeave('__LOCAL', $event, $el)"
           x-on:drop="onDrop('__LOCAL', $event)"
      >
        <div class="device-title"> Local </div>
        <template x-for="tab in localTabModel.tabs">
          <div draggable="true"
               class="tab"
               x-bind:class="{ 'tab-grayed': tab.state === 'grayed' }"
               x-on:dragstart="onDragStart($event, tab, '__LOCAL')"
               x-on:dragend="onDragEnd()"
               x-on:contextmenu="onContextMenu($event, tab, '__LOCAL', $refs.sendDropdown)"
          >
            <img x-show="tab.favicon !== null" x-bind:src="tab.favicon" alt="">
            <span x-text="tab.title"></span>
            <svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-label="Close tab" role="button">
              <line x1="7.5" y1="7.5" x2="14.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
              <line x1="14.5" y1="7.5" x2="7.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
        </template>
        <div class="placeholder" x-show="shouldShowHover('__LOCAL')">Send here</div> <!-- placeholder for drag -->
      </div>

      <div class="device-column">
        <template x-for="device in remoteDeviceModel.devices">
          <div class="tab-column"
               x-on:dragover="onDragOver(device.name, $event)"
               x-on:dragleave="onDragLeave(device.name, $event, $el)"
               x-on:drop="onDrop(device.name, $event)"
          >
            <div class="device-title" x-text="device.name"></div>
            <template x-for="tab in device.tabs">
              <div draggable="true"
                   class="tab"
                   x-bind:class="{ 'tab-grayed': tab.state === 'grayed' }"
                   x-on:dragstart="onDragStart($event, tab, device.name)"
                   x-on:dragend="onDragEnd()"
                   x-on:contextmenu="onContextMenu($event, tab, device.name, $refs.sendDropdown)"
              >
                <img x-show="tab.favicon !== null" x-bind:src="tab.favicon" alt="">
                <span x-text="tab.title"></span>
                <svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-label="Close tab" role="button">
                  <line x1="7.5" y1="7.5" x2="14.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
                  <line x1="14.5" y1="7.5" x2="7.5" y2="14.5" stroke="#555" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
            </template>
            <div class="tab placeholder" x-show="shouldShowHover(device.name)">Send here</div> <!-- placeholder for drag -->
          </div>

        </template>
      </div>

    </div>

    <button x-on:click="openOptions()" id="settings-button" aria-label="Settings">
      <img src="../icons/preferences.svg" alt="settings icon">
    </button>

    <div id="send-dropdown"
      x-ref="sendDropdown"
      x-show="sendDeviceModel.shown"
      x-bind:style="{
                      top: sendDeviceModel.posTop,
                      left: sendDeviceModel.posLeft,
                      visibility: sendDeviceModel.positioned ? 'visible' : 'hidden',
                    }"
    >
      <div class="send-dropdown-element">
        Close
      </div>
      <div class="send-dropdown-separator">
        Send to:
      </div>
      <template x-for="device in sendDeviceModel.devices">
        <div class="send-dropdown-element"
          x-text="device.prettyName || device.name"
          x-on:click="onContextMenuSend(device.name)"
        >
        </div>
      </template>
    </div>

  </body>
</html>
