name:                tabsend-server
version:             0.1.0.0
license:             AGPL-3
author:              "morj"
maintainer:          "contact@morj.com"
synopsis:            Does stuff

library:
  source-dirs: src
  dependencies:
    - base
    - aeson
    - base64
    - bytestring
    - containers
    - directory
    - hashable
    - http-types
    - random
    - servant
    - servant-server
    - text
    - unordered-containers
    - wai
    - warp

    - ppad-lmdb
  generated-other-modules:
    - Paths_tabsend_server

executables:
  app-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
      - base
      - tabsend-server
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall -Wcompat

tests:
  test:
    main: Test.hs
    source-dirs: test
    dependencies:
      - base
      - tabsend-server
      - path
      - unordered-containers
      - sydtest
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall -Wcompat

default-extensions:
  - BangPatterns
  - DisambiguateRecordFields
  - DuplicateRecordFields
  - LambdaCase
  - MultiWayIf
  - NamedFieldPuns
  - NumericUnderscores
  - OverloadedLabels
  - OverloadedStrings
  - ScopedTypeVariables
  - TypeApplications
  - TypeOperators

  - NoFieldSelectors
  - OverloadedRecordDot
